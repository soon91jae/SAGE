<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300"><rect width="1100" height="300" rx="22" fill="#0b1220"/><text x="42" y="55" fill="#fafafa" font-family="Arial,sans-serif" font-size="29" font-weight="bold">SAGE · Unified lexical grounding</text><text x="42" y="91" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Three semantic settings. One ten-image selection protocol.</text><g font-family="Arial,sans-serif"><rect x="38" y="119" width="310" height="119" rx="15" fill="#18324b" stroke="#38bdf8"/><text x="60" y="157" font-size="23" font-weight="bold" fill="#7dd3fc">VWSD</text><text x="60" y="186" font-size="18" fill="white">Nouns / word senses</text><text x="60" y="216" font-size="15" fill="#cbd5e1">e.g., mortar</text><rect x="394" y="119" width="310" height="119" rx="15" fill="#243044" stroke="#a78bfa"/><text x="416" y="157" font-size="23" font-weight="bold" fill="#c4b5fd">VerSe</text><text x="416" y="186" font-size="18" fill="white">Verbs / actions</text><text x="416" y="216" font-size="15" fill="#cbd5e1">e.g., serve</text><rect x="750" y="119" width="310" height="119" rx="15" fill="#173c38" stroke="#34d399"/><text x="772" y="157" font-size="23" font-weight="bold" fill="#6ee7b7">WikiDiverse</text><text x="772" y="186" font-size="18" fill="white">Entities / referents</text><text x="772" y="216" font-size="15" fill="#cbd5e1">e.g., Shadow</text></g><text x="550" y="276" font-size="17" font-family="Arial,sans-serif" fill="#e2e8f0" text-anchor="middle">Context + Target → 10 candidate images → Sense-aligned choice</text></svg>